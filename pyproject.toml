[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-thread-poster"
version = "0.2.0"
description = "Post threads to X (Twitter) through a real Chrome browser with a saved one-time login."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "x",
    "twitter",
    "threads",
    "playwright",
    "chrome",
    "automation",
    "social-media",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.49",
    "typer>=0.12",
]

# No [project.urls] yet: this package has no public repository, documentation
# site or changelog URL to point at. Add them here when one exists.


[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]

[project.scripts]
xposter = "xposter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/xposter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "live: needs a real logged-in X session; skipped unless XPOSTER_LIVE=1",
    "browser: launches a real local Chrome (no network, no X)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["xposter"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
